<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria | Mil Folhas</title>
    
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="main-header container">
        <div class="brand-logo">
            <a href="../index.html">
                <img src="../logo-mil-folhas.png" alt="Logótipo Mil Folhas" class="logo-img">
            </a>
        </div>
        <nav class="main-nav">
            <ul style="display: flex; gap: 20px; list-style: none;">
                <li><a href="../index.html">Início</a></li>
                <li><a href="livraria.html">Livraria</a></li>
                <li><a href="florista.html">Florista</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="contactos.html">Contactos</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        
        <div style="text-align: center; margin-top: 50px; margin-bottom: 40px;">
            <h2>Catálogo Literário</h2>
            <p>Descubra a nossa seleção de obras, desde os grandes clássicos aos lançamentos mais recentes.</p>
        </div>

        <section class="grid-3-cols">
            
            <div class="product-card">
                <img src="../livraria2.jpg" alt="Mesa de novidades com livros em destaque">
                <h3>The Life Impossible</h3>
                <p>Matt Haig</p>
                <span class="product-price">18,50 €</span>
                <button class="btn-primary">Adicionar</button>
            </div>

            <div class="product-card">
                <img src="../livraria2.jpg" alt="Mesa de novidades com livros em destaque">
                <h3>We Solve Murders</h3>
                <p>Richard Osman</p>
                <span class="product-price">19,90 €</span>
                <button class="btn-primary">Adicionar</button>
            </div>

            <div class="product-card">
                <img src="../livraria3.jpeg" alt="Canto de leitura com poltrona amarela">
                <h3>Intermezzo</h3>
                <p>Sally Rooney</p>
                <span class="product-price">17,00 €</span>
                <button class="btn-primary">Adicionar</button>
            </div>

        </section>
        
        <section class="grid-2-cols" style="margin-top: 60px; margin-bottom: 80px;">
            <div>
                <img src="../livraria4.jpeg" alt="Interior clássico da livraria com escadote de madeira" style="border-radius: 8px;">
            </div>
            <div>
                <img src="../livraria.jpeg" alt="Montra da livraria com carrinho decorativo" style="border-radius: 8px;">
            </div>
        </section>

    </main>

</body>
</html>
